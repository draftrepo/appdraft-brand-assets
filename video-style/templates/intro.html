<!doctype html>
<!-- Title sequence: "the join". Two hairlines stop short of each other (sales on one side,
     finance on the other), a teal piece closes the gap, the title rises, then the screen
     recording's first frame rises into the window so the cut to footage is invisible.
     Query: len (5.2), title ("Line one|Line two"), sub, left, right, eyebrow,
            to (image: first frame of the footage; without it the card fades to black),
            part (1) partname ("Who we are") of (4)  -> the footer marker it lands on -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="system.css"><style>
  .logo { position: absolute; left: var(--margin); top: 92px; width: 176px; }
  .eyebrow { position: absolute; right: var(--margin); top: 104px; }
  .rail { position: absolute; top: 416px; height: 2px; background: rgba(243,246,248,.30); }
  .rail.l { left: 0; width: 868px; transform-origin: left center; }
  .rail.r { left: 1052px; right: 0; transform-origin: right center; }
  .join { position: absolute; top: 415px; left: 868px; width: 184px; height: 4px; border-radius: 2px; background: var(--teal); transform-origin: center; }
  .end { position: absolute; top: 410px; width: 2px; height: 14px; background: rgba(243,246,248,.55); }
  .end.l { left: 866px; } .end.r { left: 1052px; }
  .side { position: absolute; top: 362px; font-weight: 600; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; color: var(--mist); white-space: nowrap; }
  .side.l { right: 1084px; } .side.r { left: 1084px; }
  .display { position: absolute; left: var(--margin); top: 486px; }
  .body { position: absolute; left: calc(var(--margin) + 4px); top: 786px; }
  @keyframes join { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
  @keyframes dim  { from { opacity: 1; } to { opacity: .0; } }
  .rail { animation: drawx 1.1s var(--draw) .45s both, gone .34s linear var(--o) forwards; }
  .end  { animation: fade .3s linear 1.4s both, gone .25s linear 2.05s forwards; }
  .side { animation: up .8s var(--enter) var(--d) both, gone .5s linear 2.0s forwards; }
  .join { animation: join .7s var(--move) 1.85s both, gone .34s linear var(--o) forwards; }
  .grp  { animation: away .38s var(--exit) var(--o) forwards; }
  .window { animation: win-in .85s var(--enter) var(--w) both; }
  .footer { animation: fade .5s linear var(--f) both; }
</style></head><body>
  <div class="backdrop"></div>
  <div class="grp">
    <img class="logo a-fade" style="--d:.3s" src="../assets/appdraft-wordmark-white.svg">
    <div class="eyebrow a-fade" id="eyebrow" style="--d:.5s"></div>
    <div class="rail l"></div><div class="rail r"></div>
    <div class="end l"></div><div class="end r"></div>
    <div class="side l" id="left" style="--d:.95s"></div><div class="side r" id="right" style="--d:1.1s"></div>
    <div class="join"></div>
    <div class="display" id="title"></div>
    <div class="body a-up" id="sub" style="--d:2.75s"></div>
  </div>
  <div class="window" id="win"><img id="to"></div>
  <div class="footer" id="footer"><div class="marker"><div class="ticks" id="ticks"></div><span id="partname"></span></div>
    <img class="mark" src="../assets/appdraft-wordmark-white.svg"></div>
  <div class="black" id="black"></div>
<script src="system.js"></script><script>
  const len = N("len", 5.2), to = P("to");
  const out = len - (to ? 1.15 : .75);                       // text leaves
  const root = document.documentElement.style;
  root.setProperty("--o", out + "s"); root.setProperty("--w", (len - .9) + "s"); root.setProperty("--f", (len - .55) + "s");
  fill("eyebrow", "eyebrow"); fill("sub", "sub", "A walkthrough of the whole billing cycle");
  fill("left", "left", "Sales in Salesforce"); fill("right", "right", "Finance in Xero");
  lines(document.getElementById("title"), P("title", "Xero and Salesforce,|joined up"), 2.2, .11);
  ticks(document.getElementById("ticks"), N("part", 1), N("of", 4)); fill("partname", "partname", "Who we are");
  if (to) document.getElementById("to").src = to;
  else { document.getElementById("win").style.display = "none"; document.getElementById("footer").style.display = "none"; }
  blackout(len, .45, to ? 0 : .6);
</script></body></html>
